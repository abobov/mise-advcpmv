name: Schedule

on:
  schedule:
    # Run weekly on Monday at 06:00 UTC to detect when upstream
    # jarun/advcpmv master publishes a new patch that breaks this plugin.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI (mise run ci) on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install gcc texinfo xz

      - run: mise run ci

  test-latest:
    name: Test advcpmv@latest (weekly) on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install gcc texinfo xz

      - name: Link local plugin
        run: mise plugin link --force advcpmv .

      - name: List available versions
        run: mise ls-remote advcpmv

      - name: Install advcpmv@latest
        run: mise install advcpmv@latest

      - name: Test advcp --version
        run: mise exec advcpmv@latest -- advcp --version

      - name: Test advmv --version
        run: mise exec advcpmv@latest -- advmv --version
